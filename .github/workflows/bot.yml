name: ПДД-бот

on:
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска
  schedule:
    - cron: "17 */6 * * *"    # страховка: подхватить бота, если цепочка оборвалась

concurrency:                  # никогда не запускать две копии бота одновременно
  group: pdd-bot
  cancel-in-progress: false

permissions:
  contents: write             # чтобы сохранять progress.json в репозиторий
  actions: write              # чтобы бот сам себя перезапускал

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить библиотеку
        run: pip install "python-telegram-bot>=21,<23"

      - name: Бот работает ~5 ч 45 мин
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: timeout 345m python bot.py || true

      - name: Сохранить прогресс игроков
        run: |
          git config user.name "pdd-bot"
          git config user.email "pdd-bot@users.noreply.github.com"
          git pull --rebase || true
          git add progress.json 2>/dev/null || true
          git commit -m "Сохранение прогресса" || true
          git push || true

      - name: Перезапустить бота
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref "${{ github.ref_name }}"
